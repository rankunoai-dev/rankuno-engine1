# Railway deployment configuration for Rankuno AI Engine.
#
# Only [build] and [deploy] are read from this file. Service variables are set
# in the Railway dashboard (service -> Variables), not here; an [env] or
# [services] table in this file is silently ignored.
#
# Required variables on the API service:
#   DATABASE_URL          = ${{Postgres.DATABASE_URL}}
#   GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET / GOOGLE_OAUTH_REFRESH_TOKEN
#   GUARDRAILS_ENABLED=true, REQUIRE_APPROVAL_FOR_WRITES=true, REQUIRE_APPROVAL_FOR_SPEND=true
#   GSC_CREDENTIAL_ENCRYPTION_KEY = base64url of 32 random bytes (ADR 0037). Required
#       because DATABASE_URL is set: without it the server refuses to start and the
#       healthcheck keeps the previous deployment serving. Back it up; losing it
#       means re-adding every org GSC account.
#
# Org GSC accounts are durable: they live in Postgres (org_gsc_accounts, encrypted,
# ADR 0037), not in /app/.orgs. Known gap: other org settings (/app/.orgs) and
# operator logins (/app/.operators) still live on the container disk, so a
# redeploy wipes them. Jobs are in Postgres (ADR 0022).
#
# The start command lives in the Dockerfile CMD, so there is one source of truth.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
