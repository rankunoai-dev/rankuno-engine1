# Railway deployment configuration for Rankuno AI Engine.
#
# Only [build] and [deploy] are read from this file. Service variables are set
# in the Railway dashboard (service -> Variables), not here; an [env] or
# [services] table in this file is silently ignored.
#
# Required variables on the API service:
#   DATABASE_URL          = ${{Postgres.DATABASE_URL}}
#   GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET / GOOGLE_OAUTH_REFRESH_TOKEN
#   GUARDRAILS_ENABLED=true, REQUIRE_APPROVAL_FOR_WRITES=true, REQUIRE_APPROVAL_FOR_SPEND=true
#
# Known gap: jobs (/app/.jobs), org GSC accounts (/app/.orgs) and operator
# logins (/app/.operators) live on the container disk, so a redeploy wipes them.
# The jobs directory is not yet configurable, so one volume cannot hold all three.
#
# The start command lives in the Dockerfile CMD, so there is one source of truth.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
