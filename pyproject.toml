[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rankuno-automation"
version = "0.1.0"
description = "Rankuno Agentic Engineering Infrastructure & SDLC Governance Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Rankuno AI Automation Team" }]

# Core runtime dependencies. Keep this list MINIMAL — the core layer must stay
# importable without any domain/vendor SDK installed. Domain libraries belong in
# the optional extras below.
#
# httpx is core rather than a `seo` extra: it is generic HTTP, not a vendor SDK,
# and BaseAPIClient is the platform's mandated outbound abstraction. Leaving it
# in an extra meant `src/integrations` could not make a request without the
# caller supplying a client. Upper bound is deliberate — httpx has made breaking
# changes across minor versions, and a silent transport change would surface as
# a crawl failure rather than an import error.
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "tenacity>=8.3",
    "httpx>=0.27.0,<1.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    # PDF generation for the URL-list download's PDF sibling (`urls.pdf`,
    # `MasterURLReport.generate_pdf`). weasyprint was rejected: it needs an
    # OS-level GTK3 runtime, which complicates local Windows dev under ADR
    # 0004. reportlab is a plain pip wheel, matching every other dependency
    # here. Core rather than the `seo` extra for the same reason as
    # `openpyxl` above — `reports.py` must stay importable without the full
    # `seo` extra — though that precedent works against this list's own
    # "keep it MINIMAL" instruction; see ADR 0024.
    "reportlab>=4.0,<5.0",
    "psycopg[binary]>=3.1.0,<4.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "redis>=5.0.0,<6.0.0",
    "celery>=5.3.0,<6.0.0",
    # Ed25519 signing/verification of worker dispatch assignments (ADR 0028).
    # Was already installed transitively (google-auth); declared explicitly
    # because `src/core/worker_dispatch_keys.py` imports it and the worker must
    # not depend on another package's dependency list. No upper bound on
    # purpose: cryptography bumps its major version several times a year, the
    # Ed25519 API used here has been stable since 2.6, and a cap would hold
    # back security releases of the one library where those matter most.
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "alembic>=1.13.0,<2.0.0",
]
# Domain extras are declared up-front so the dependency surface is reviewable,
# but they are NOT installed by default and no code imports them yet.
# The local API server (`src/api/`). An extra rather than a core dependency:
# importing this package as a library must not drag in a web server, and the
# engine is fully usable without one — `scripts/run_crawl.py` needs none of it.
#
# `scripts/bootstrap.ps1` installs this extra by default, because `mypy --strict`
# runs over the whole tree and a missing `fastapi` would fail the quality gate on
# a fresh clone rather than producing a clear "not installed" error.
api = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.28.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",
    "google-auth>=2.32,<3.0",
    "google-api-python-client>=2.100,<3.0",
    "requests>=2.32,<3.0",
    "selectolax>=0.3.21",
]
seo = [
    # httpx moved to core dependencies above; listing it here too would let the
    # two bounds drift apart.
    # openpyxl moved to core dependencies above; listing it here too would let the
    # two bounds drift apart.
    "advertools>=0.14",
    "trafilatura>=1.9",
    "selectolax>=0.3.21",
    "sentence-transformers>=3.0",
    "playwright>=1.44",
]
gsc = [
    # Google Search Console API client. Used by src/integrations/gsc_client.py
    # for read-only access to GSC analytics and property metadata.
    "google-auth>=2.32,<3.0",
    "google-api-python-client>=2.100,<3.0",
    "requests>=2.32,<3.0",
]
pywin32 = [
    # Windows Job Object process governance (ADR 0013): `CreateJobObject` /
    # `AssignProcessToJobObject` with `JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE` is
    # what `src/core/process_supervisor.py` uses to guarantee a supervised
    # child cannot outlive this engine's control of it, even across a crash.
    # `sys_platform=='win32'` so `pip install -e ".[dev]"` still succeeds on
    # a non-Windows contributor machine or CI runner (`ci.yml` runs on
    # `ubuntu-latest`) — the import itself is deferred inside
    # `_win32_bindings.load_win32()` for exactly this reason, so the rest of
    # `process_supervisor.py` stays importable and unit-testable without it.
    "pywin32>=306; sys_platform=='win32'",
]

# The only console script this package declares. `run_worker_daemon` had no
# caller anywhere outside its own module and tests (ADR 0015): the loop was
# correct and unreachable, so nothing could start a desktop worker.
[project.scripts]
rankuno-worker = "src.modules.seo.screaming_frog_control.worker_daemon_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Lint / format — ruff is the single source of truth for both.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "ANN",      # missing annotations — enforces the strict-typing standard
    "S",        # bandit security checks
    "T20",      # no print() — use the structured logger
    "RET", "SIM", "C4",
    "D",        # docstrings
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "ANN401", # allow typing.Any where genuinely needed (documented at each site)
]

[tool.ruff.lint.per-file-ignores]
# `S105`/`S106` (hardcoded password string / argument) are unavoidable in a suite
# whose whole job is to prove that credentials are handled correctly: a test for
# `SecretStr` masking has to pass a literal secret in to check it comes back
# masked. Scoped to `tests/**` rather than dodged with inline `# noqa` at each
# site, so the check keeps its full force over `src/**`, which is the only place
# a literal credential would actually be a leak.
"tests/**" = [
    "S101",
    "S105",
    "S106",
    "D100",
    "D101",
    "D102",
    "D103",
    "ANN201",
    "ANN001",
]
"scripts/**" = ["T201", "D103", "D415", "E501"]
# `scripts/chaos_test.py` is a hand-run resilience harness, not production code:
# `assert` is its assertion mechanism exactly as it is under pytest, which is
# why `tests/**` exempts the same rule. Scoped to this one file so a real script
# cannot smuggle an `assert` into a code path that runs under `python -O`.
"scripts/chaos_test.py" = ["S101"]
# The only undocumented public member in the masterfile services is the
# `metadata` property, which overrides an abstract property already documented
# on `MasterfileService` and whose body is a single literal `MasterfileMetadata`.
# A docstring there could only restate the literal, and 21 copies of "Return the
# metadata" is noise that makes the docstring convention mean less everywhere
# else. Ruff has no inherited-docstring awareness, so the exemption lives here.
"src/modules/seo/deliverables/masterfile_*.py" = ["D102"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Type checking — strict on src/, relaxed on tests/.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^build/", "^dist/"]
# `src` is itself a package (src/__init__.py), so imports read `src.core.x` and
# the import root is the repo root — not `src/`. Stated explicitly so mypy, ty
# and pyright all resolve modules identically.
mypy_path = "."

[tool.ty.src]
root = "."

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# `openpyxl` ships no type information and lives in the optional `seo` extra,
# which the default bootstrap does not install. Without this, `mypy --strict`
# fails on a fresh clone for a dependency that is deliberately optional.
[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

# `reportlab` ships no `py.typed` marker either. Same treatment as
# `openpyxl` immediately above, for the same reason: without this,
# `mypy --strict` fails on the PDF generator's import for a dependency this
# project deliberately installs unconditionally.
[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

# `pywin32` ships no type information and is Windows-only (`sys_platform`
# marker on the `pywin32` extra), so it is never installed on the
# `ubuntu-latest` CI runners `mypy src` runs on. Without this, `mypy --strict`
# would fail to resolve `win32api`/`win32job`/`win32process`/`win32con`/
# `win32event`/`pywintypes`, imported only inside
# `src/core/_win32_bindings.py::load_win32()`, or `win32cred`, imported only
# inside `src/core/credential_vault.py::WindowsCredentialVault` (ADR 0030).
[[tool.mypy.overrides]]
module = ["win32api", "win32con", "win32cred", "win32event", "win32job", "win32process", "pywintypes"]
ignore_missing_imports = true

# `celery` ships no `py.typed` marker and no bundled stubs, so `mypy --strict`
# cannot resolve `Celery` or `Task` however they are annotated. The published
# stubs live in the third-party `celery-types` distribution, which is not a
# declared dependency of this project. Same treatment as `openpyxl` above:
# scoped to the one module, so nothing else silently degrades to `Any`.
[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: touches a real external service (skipped in CI by default)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Governance floor. Raise this as the codebase matures; never lower it.
fail_under = 85
